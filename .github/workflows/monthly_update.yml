name: Monthly data refresh

on:
  schedule:
    # 每月 6 日 09:17 UTC（北京时间 17:17），避开整点拥堵
    - cron: "17 9 6 * *"
  workflow_dispatch:   # 允许在 Actions 页手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (含中文字体, 防止图表乱码)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt

      - name: Rebuild panel, signals, backtest and figures
        run: |
          python3 code/01_fetch_panel.py
          python3 code/02_analyze.py
          python3 code/03_figures.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ figures/
          if git diff --cached --quiet; then
            echo "No upstream data change, skip commit."
          else
            git commit -m "chore: monthly data refresh ($(date +%Y-%m))"
            git push
          fi
